# Static Neolen website. Files come from `pnpm build` (out/) and are copied to
# /var/www/neolen.com by deploy/deploy.sh. TLS is added by:
#   sudo certbot --nginx -d neolen.com -d www.neolen.com
server {
  listen 80;
  listen [::]:80;
  server_name neolen.com www.neolen.com;

  root /var/www/neolen.com;
  index index.html;

  # ACME HTTP-01 challenges (certbot)
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
    default_type "text/plain";
  }

  # Canonical host is the apex domain.
  if ($host = www.neolen.com) {
    return 301 https://neolen.com$request_uri;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json application/xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /faq {
    return 301 /frequently-asked-questions;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  # Hashed build assets never change.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # /contact -> contact.html; strip trailing slashes so each page has one URL.
  location / {
    rewrite ^/(.+)/$ /$1 permanent;
    try_files $uri $uri.html $uri/index.html =404;
  }

  error_page 404 /404.html;
}
